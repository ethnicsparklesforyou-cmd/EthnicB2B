name: iOS Build & Deploy to App Store Connect

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to App Store
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Setup CocoaPods Cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Validate & Reconstruct App Store Connect API Key (.p8 PEM & DER check)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APP_STORE_CONNECT_KEY || secrets.P8_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          python3 -c "
          import os, sys, base64, textwrap

          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          key_id = os.environ.get('KEY_ID', '').strip()
          issuer_id = os.environ.get('ISSUER_ID', '').strip()

          if not key_id:
              print('❌ ERROR: GitHub Secret APP_STORE_CONNECT_KEY_ID is missing!')
              sys.exit(1)

          if not issuer_id:
              print('❌ ERROR: GitHub Secret APP_STORE_CONNECT_ISSUER_ID is missing!')
              sys.exit(1)

          if not raw:
              print('❌ ERROR: GitHub Secret APP_STORE_CONNECT_API_KEY is missing!')
              sys.exit(1)

          # Auto-detect if raw input is base64 encoded
          try:
              decoded_attempt = base64.b64decode(raw).decode('utf-8', errors='ignore')
              if 'PRIVATE KEY' in decoded_attempt:
                  raw = decoded_attempt
          except Exception:
              pass

          # Strip header, footer, and all whitespace
          clean = raw.replace('-----BEGIN PRIVATE KEY-----', '').replace('-----END PRIVATE KEY-----', '')
          clean = ''.join(clean.split())

          # Validate base64 DER structure
          try:
              der = base64.b64decode(clean)
              print(f'Validated DER byte count: {len(der)}')
              if len(der) < 100:
                  print(f'❌ ERROR: APP_STORE_CONNECT_API_KEY is truncated! DER length is {len(der)} bytes (expected ~120-150 bytes).')
                  print('Please open your AuthKey_.p8 file and copy its ENTIRE contents into GitHub Secrets APP_STORE_CONNECT_API_KEY.')
                  sys.exit(1)
          except Exception as e:
              print(f'❌ ERROR: Cannot decode base64 key: {e}')
              sys.exit(1)

          # Wrap base64 string to standard 64 chars per line
          wrapped = '\n'.join(textwrap.wrap(clean, 64))
          pem = f'-----BEGIN PRIVATE KEY-----\n{wrapped}\n-----END PRIVATE KEY-----\n'

          target_path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')
          with open(target_path, 'w') as f:
              f.write(pem)

          print(f'✅ Successfully generated and verified AuthKey_{key_id}.p8 ({len(pem)} bytes)')
          "

      - name: Build Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cd ios
          xcodebuild -workspace JwelleryApp.xcworkspace \
                     -scheme JwelleryApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/JwelleryApp.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath "$KEY_PATH" \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     archive

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cd ios
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/JwelleryApp.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/build \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath "$KEY_PATH" \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app -f $RUNNER_TEMP/build/*.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
