name: Build & Deploy iOS App Store Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build & Upload iOS App Store Bundle
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Create React Native JS Bundle
        run: npm run bundle:ios

      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace ios/JwelleryApp.xcworkspace \
                     -scheme JwelleryApp \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/JwelleryApp.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM=693374F6BN \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Create Valid IPA Package
        run: |
          mkdir -p build/out/Payload
          if [ -d "build/JwelleryApp.xcarchive/Products/Applications/JwelleryApp.app" ]; then
            cp -r build/JwelleryApp.xcarchive/Products/Applications/JwelleryApp.app build/out/Payload/
            cd build/out
            zip -r JwelleryApp.ipa Payload
          elif [ -d "build/JwelleryApp.xcarchive" ]; then
            cd build
            zip -r out/JwelleryApp.xcarchive.zip JwelleryApp.xcarchive
          fi

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: build/out/*
          if-no-files-found: warn

      - name: Direct Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        if: env.KEY_ID != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "App Store Connect API Key installed successfully!"
          
          IPA_FILE=$(ls build/out/*.ipa 2>/dev/null | head -n 1 || ls build/out/*.zip | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."

          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
